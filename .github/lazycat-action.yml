version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: gotify.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gotify

build:
  run_buildscript: false

images:
  - id: gotify
    target: service
    service: gotify
    source: docker.io/gotify/server
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Gotify
    summary: A simple server for sending and receiving messages
