params:
  - id: admin_password
    type: secret
    name: Administrator password
    description: Password used to initialize and automatically sign in to the local administrator account.
    default_value: $random(len=24)
    optional: false

  - id: timezone
    type: string
    name: Time zone
    description: IANA time zone used by Gotify, for example Asia/Shanghai.
    default_value: Asia/Shanghai
    optional: false

  - id: oidc_enabled
    type: bool
    name: Enable OIDC
    description: Enable login through an OpenID Connect identity provider.
    default_value: "false"
    optional: false

  - id: oidc_issuer
    type: string
    name: OIDC issuer
    description: OIDC issuer URL used to discover provider endpoints. Required when OIDC is enabled.
    optional: true

  - id: oidc_client_id
    type: string
    name: OIDC client ID
    description: Client ID registered for Gotify at the identity provider. Required when OIDC is enabled.
    optional: true

  - id: oidc_client_secret
    type: secret
    name: OIDC client secret
    description: Client secret registered for Gotify at the identity provider. Required when OIDC is enabled.
    optional: true

  - id: oidc_auto_register
    type: bool
    name: Automatically register OIDC users
    description: Create a local Gotify user automatically on the first successful OIDC login.
    default_value: "true"
    optional: false

  - id: oidc_username_claim
    type: string
    name: OIDC username claim
    description: ID-token claim used as the Gotify username, commonly preferred_username or email.
    default_value: preferred_username
    optional: false

  - id: oidc_link_by_username
    type: bool
    name: Link users by username
    description: Link an OIDC identity to an existing local user with the same username.
    default_value: "false"
    optional: false

  - id: oidc_scopes
    type: string
    name: OIDC scopes
    description: Comma-separated scopes requested from the identity provider.
    default_value: openid,profile,email
    optional: false

  - id: oidc_prompt
    type: string
    name: OIDC prompt
    description: Comma-separated prompt values sent to the identity provider; leave empty to omit the parameter.
    default_value: login
    optional: true

  - id: oidc_idp_name
    type: string
    name: Identity provider name
    description: Name displayed on the OIDC login button.
    default_value: OIDC
    optional: false

  - id: oidc_auto_redirect
    type: bool
    name: Automatically redirect to OIDC
    description: Redirect directly to the identity provider instead of showing the Gotify login page.
    default_value: "false"
    optional: false

  - id: oidc_groups_claim
    type: string
    name: OIDC groups claim
    description: Claim containing group memberships; leave empty to disable group mapping.
    optional: true

  - id: oidc_groups_user
    type: string
    name: Allowed user groups
    description: Comma-separated groups allowed to sign in with user permissions; leave empty to allow all authenticated users.
    optional: true

  - id: oidc_groups_admin
    type: string
    name: Administrator groups
    description: Comma-separated groups granted Gotify administrator permissions.
    optional: true

